camera_manager:
  ros__parameters:
    sim: false
    camera_id: [1, 2]
    image_topic: [
      "/left_camera/color/image_raw", 
      "/right_camera/color/image_raw"
      ]
    pointcloud_topic: [
      "/left_camera/depth/color/points", 
      "/right_camera/depth/color/points"
      ]

data_saver:
  ros__parameters:
    workspace_name: "robostore_ws"
    save_folder_name: "vision_data"

web_video_server:
  ros__parameters:
    port: 18080
    address: '192.168.8.101'
    server_threads: 2
    ros_threads: 4
    # default_stream_type: 'h264'
  
# RealSense Camera Configuration
/left_camera/realsense:
  ros__parameters:
    serial_no: "405622074042" 
    usb_port_id: ""
    device_type: ""
    initial_reset: false
    camera_name: "left_camera"

    # Color stream configuration
    enable_color: true
    rgb_camera:
      profile: "1280,720,6" # Width x Height x FPS
      color_format: "RGB8"
      enable_auto_exposure: true
      enable_auto_white_balance: true
      host_performance: 0
      global_time_enabled: true

    # Depth stream configuration
    enable_depth: true
    depth_module:
      profile: "1280,720,6"
      depth_format: "Z16"
      alternate_ir: false
      confidence_threshold: 1
      digital_gain: 2
      receiver_gain: 18
      host_performance: 0
      min_distance: 190
      global_time_enabled: true
      noise_filtering: 4
      post_processing_sharpening: 1
      pre_processing_sharpening: 0
      sensor_mode: 1
      visual_preset: 5
      invalidation_bypass: false

    # Infrared streams
    enable_infra: true
    enable_infra1: false
    enable_infra2: false
    enable_confidence: true

    # IMU settings
    enable_gyro: false
    enable_accel: false
    gyro_fps: 0
    accel_fps: 0
    unite_imu_method: 2 # 0-None, 1-copy, 2-linear_interpolation

    intra_process_comms: true
    enable_sync: true

    # Point cloud settings
    pointcloud:
      enable: true
      stream_filter: 2
      # stream_index_filter: 0
      ordered_pc: true # false
      allow_no_texture_points: false

    enable_rgbd: true

    # Depth processing filters
    align_depth:
      enable: true  
    colorizer:
      enable: false
    decimation_filter:
      enable: true
    spatial_filter:
      enable: true
    temporal_filter:
      enable: true
    disparity_filter:
      enable: false
    hole_filling_filter:
      enable: true
    hdr_merge:
      enable: true

    # TF settings
    publish_odom_tf: false
    publish_tf: true
    tf_publish_rate: 0.0  # 0=only on change
    
    # Advanced settings
    angular_velocity_cov: 0.01
    linear_accel_cov: 0.01
    clip_distance: -2.0  # Negative value disables clipping
    diagnostics_period: 5.0  # 0=disabled
    wait_for_device_timeout: -1.0  # -1=wait indefinitely
    reconnect_timeout: 3.0

